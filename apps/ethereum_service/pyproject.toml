[tool.poetry]
package-mode = false
name = "ethereum-service"
version = "0.1.0"
description = "JWT auth, registration, permissions"
authors = ["viatkindima@gmail.com"]

[tool.poetry.dependencies]
python = "^3.12"

# web framework
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}

# auth
PyJWT = "^2.8"

# database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"

# config
pydantic-settings = "^2.3"

# messaging
faststream = {extras = ["rabbit"], version = "^0.5"}

# tasks
taskiq = "^0.12"
taskiq-fastapi = "^0.3"
taskiq-aio-pika = "^0.4"
taskiq-redis = "^1.2.2"

# email + http
fastapi-mail = "^1.4"
httpx = "^0.27"

# storage & di
boto3 = "^1.34"
dishka = "^1.10.1"
redis = "^7.0.0"
psycopg2-binary = "^2.9.12"
python-multipart = "^0.0.30"
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
cryptography = "^48.0.0"
fastapi-pagination = "^0.15.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
factory-boy = "^3.3"

[tool.poetry.group.lint.dependencies]
ruff = "^0.4"
mypy = "^1.10"
sqlalchemy = {extras = ["mypy"], version = "^2.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]